<!DOCTYPE html>
<html lang="en"><head><title>Groups – Frantech Ajo</title>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</head>
<body class="invisible bg-surface font-body-md text-on-surface antialiased min-h-screen">
<header id="hdr"></header>
<main class="pt-16 pb-28 px-margin"><div class="flex flex-col w-full pt-3">
  <div class="rise mb-3" style="--i:0"><h1 class="font-headline-md text-headline-md leading-tight">Explore Groups</h1><p class="font-label-sm text-label-sm text-on-surface-variant">Pick a group, choose your number, save together</p></div>
  <div class="rise w-full bg-surface-container-low p-1 rounded-full flex mb-4" style="--i:1" id="tabs"></div>
  <div id="kycBanner" class="mb-4"></div>
  <div class="rise relative w-full mb-4" style="--i:2">
    <span class="material-symbols-outlined text-outline absolute left-3.5 top-1/2 -translate-y-1/2 text-[20px] pointer-events-none">search</span>
    <input id="q" class="w-full h-12 pl-11 pr-10 rounded-xl bg-surface-container-lowest placeholder:text-outline font-body-md text-body-md shadow-[0_4px_20px_-2px_rgba(15,23,42,0.04)] focus:outline-none focus:ring-2 focus:ring-primary-container" placeholder="Search groups..." type="text"/>
  </div>
  <div id="list" class="flex flex-col gap-space-sm"></div>
</div></main>
<nav id="nav"></nav>

<datalist id="banks"><option value="Access Bank"><option value="GTBank"><option value="First Bank"><option value="UBA"><option value="Zenith Bank"><option value="Opay"><option value="Palmpay"><option value="Kuda"><option value="Moniepoint"><option value="Wema Bank"><option value="Sterling Bank"><option value="Fidelity Bank"><option value="Union Bank"><option value="Stanbic IBTC"><option value="FCMB"><option value="Polaris Bank"><option value="Ecobank"><option value="Keystone Bank"><option value="Providus Bank"><option value="Jaiz Bank"></datalist>

<div id="modal" class="fixed inset-0 z-[70] hidden items-end justify-center bg-inverse-surface/40 backdrop-blur-sm fade">
  <div id="sheet" class="sheet w-full max-w-md bg-surface-container-lowest rounded-t-[28px] p-margin pb-8 shadow-2xl max-h-[90vh] overflow-y-auto"></div>
</div>

<script>
(async()=>{
  const {profile}=await App.init({title:'Groups',active:'groups'});
  const $=id=>document.getElementById(id);
  const ICON={land:'landscape',business:'storefront',education:'school',travel:'flight',family:'family_restroom',other:'groups'};
  const THRESHOLD=50000, verified=profile.kyc_status==='verified';
  let groups=[],status='open',q='';
  const mineFirst=location.hash==='#mine';

  if(!verified){const pend=profile.kyc_status==='pending';
    $('kycBanner').innerHTML='<a href="kyc.html" class="rise press block rounded-xl bg-gradient-to-r from-primary to-primary-container text-on-primary p-4 shadow-[0_10px_25px_-4px_rgba(0,82,255,0.22)]" style="--i:2"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-[28px] text-secondary-fixed">'+(pend?'hourglass_top':'verified_user')+'</span><div class="flex-1"><p class="font-headline-sm text-headline-sm leading-snug">'+(pend?'Verification under review':'Verify your identity')+'</p><p class="font-body-sm text-body-sm text-on-primary-container">'+(pend?'We will unlock joining once approved.':'Needed to join groups above '+App.money(THRESHOLD)+' per payment.')+'</p></div><span class="material-symbols-outlined">arrow_forward</span></div></a>'}

  function drawTabs(){
    const c=s=>groups.filter(g=>g.status===s).length;
    $('tabs').innerHTML=[['open','Open'],['active','Running'],['completed','Completed']].map(([k,l])=>'<button data-s="'+k+'" class="flex-1 py-2 rounded-full font-label-md text-label-md transition-all '+(status===k?'bg-primary text-on-primary shadow-sm':'text-on-surface-variant')+'" type="button">'+l+' ('+c(k)+')</button>').join('');
    $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{status=b.dataset.s;drawTabs();render()});
  }
  $('q').oninput=e=>{q=e.target.value.trim().toLowerCase();render()};

  function card(g,i){
    const full=g.member_count>=g.max_members,pct=Math.round(g.member_count/g.max_members*100);
    let badge=['Open','bg-secondary-fixed/30 text-secondary'];
    if(g.joined)badge=['Joined','bg-primary-fixed text-primary'];else if(g.status==='active')badge=['Started','bg-surface-container-high text-on-surface-variant'];else if(g.status==='completed')badge=['Completed','bg-surface-container-high text-on-surface-variant'];else if(full)badge=['Full','bg-surface-container-high text-on-surface-variant'];
    const left=g.max_members-g.member_count;
    const note=g.status==='open'?(full?'Group is full':(left<=2?'<span class="text-error font-medium">Only '+left+' number'+(left>1?'s':'')+' left</span>':g.member_count+' / '+g.max_members+' joined')):(g.member_count+' members');
    let btn='';
    if(g.joined)btn='<a href="group.html?id='+g.id+'" class="press px-3.5 py-1.5 rounded-full bg-primary-fixed text-primary font-label-md text-label-md flex items-center gap-1">View<span class="material-symbols-outlined text-[15px]">arrow_forward</span></a>';
    else if(g.status==='open'&&!full)btn='<button data-join="'+g.id+'" class="press px-3.5 py-1.5 rounded-full bg-primary text-on-primary font-label-md text-label-md flex items-center gap-1" type="button">Join<span class="material-symbols-outlined text-[15px]">arrow_forward</span></button>';
    return '<article class="rise bg-surface-container-lowest p-4 rounded-xl shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)]" style="--i:'+Math.min(i,8)+'"><div class="flex items-start gap-3"><div class="w-12 h-12 rounded-xl bg-primary-fixed text-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-[26px]">'+(ICON[g.category]||'groups')+'</span></div><div class="flex-1 min-w-0"><div class="flex items-center justify-between gap-1"><h3 class="font-headline-sm text-headline-sm truncate">'+App.esc(g.title)+'</h3><span class="px-2 py-0.5 rounded-full font-label-sm text-label-sm font-semibold shrink-0 '+badge[1]+'">'+badge[0]+'</span></div><p class="font-label-md text-label-md text-on-surface-variant mt-0.5">'+App.money(g.contribution_amount)+' per '+App.per(g)+' <span class="text-outline">·</span> '+g.max_members+' '+App.per(g)+'s</p><div class="flex items-center justify-between mt-2 mb-1"><span class="font-label-sm text-label-sm text-on-surface-variant">Payout per turn: <strong class="text-on-surface font-semibold">'+App.money(g.contribution_amount*g.max_members)+'</strong></span><span class="font-label-sm text-label-sm font-bold text-primary">'+pct+'%</span></div><div class="w-full h-1.5 bg-surface-container-high rounded-full overflow-hidden"><div class="bar h-full bg-secondary rounded-full" style="width:0" data-w="'+pct+'"></div></div></div></div><div class="flex items-center justify-between mt-3 bg-surface-container-low/50 -mx-4 -mb-4 px-4 py-2.5 rounded-b-xl"><div class="flex items-center gap-1.5 text-on-surface-variant font-label-sm text-label-sm"><span class="material-symbols-outlined text-[16px] text-secondary">group</span><span>'+note+'</span></div>'+btn+'</div></article>';
  }
  function render(){
    const rows=groups.filter(g=>g.status===status&&(!q||g.title.toLowerCase().includes(q)));
    $('list').innerHTML=rows.length?rows.map(card).join(''):'<div class="rise flex flex-col items-center text-center py-12 px-4 bg-surface-container-lowest rounded-xl"><div class="w-16 h-16 rounded-full bg-surface-container flex items-center justify-center text-outline mb-3"><span class="material-symbols-outlined text-[32px]">savings</span></div><h4 class="font-headline-sm text-headline-sm">No groups here yet</h4><p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mt-1">New groups appear here as soon as the admin posts them.</p></div>';
    requestAnimationFrame(()=>requestAnimationFrame(()=>$('list').querySelectorAll('.bar').forEach(b=>b.style.width=b.dataset.w+'%')));
    $('list').querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>openJoin(groups.find(g=>g.id===b.dataset.join)));
  }
  async function load(){
    $('list').innerHTML=[0,1,2].map(()=>'<div class="shimmer h-[140px] rounded-xl"></div>').join('');
    const {data,error}=await sb.rpc('groups_overview');
    if(error){$('list').innerHTML='<div class="rounded-xl bg-error-container text-on-error-container p-4 font-body-md text-body-md">Could not load groups. Run admin-setup.sql in Supabase first.<br><span class="font-body-sm text-body-sm">'+App.esc(error.message)+'</span></div>';return}
    groups=data||[];
    if(mineFirst&&groups.some(g=>g.joined)){const m=groups.find(g=>g.joined);status=m.status}
    drawTabs();render();
  }

  function openJoin(g){
    const m=$('modal'),s=$('sheet'),need=g.contribution_amount>THRESHOLD&&!verified;
    const head='<div class="w-12 h-1.5 bg-surface-container-highest rounded-full mx-auto mb-4"></div><div class="flex items-start justify-between mb-4"><div><span class="px-2.5 py-0.5 rounded-full bg-secondary-fixed/40 text-secondary font-label-sm text-label-sm font-semibold">Join group</span><h3 class="font-headline-md text-headline-md mt-1">'+App.esc(g.title)+'</h3></div><button id="x" class="w-9 h-9 rounded-full bg-surface-container-low flex items-center justify-center" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button></div>';
    const stats='<div class="grid grid-cols-2 gap-3 mb-4"><div class="p-3 bg-surface-container-low rounded-xl"><span class="font-label-sm text-label-sm text-on-surface-variant block">You pay</span><span class="font-headline-sm text-headline-sm text-primary font-bold">'+App.money(g.contribution_amount)+'</span><span class="font-label-sm text-label-sm text-on-surface-variant"> / '+App.per(g)+'</span></div><div class="p-3 bg-surface-container-low rounded-xl"><span class="font-label-sm text-label-sm text-on-surface-variant block">You receive</span><span class="font-headline-sm text-headline-sm text-secondary font-bold">'+App.money(g.contribution_amount*g.max_members)+'</span><span class="font-label-sm text-label-sm text-on-surface-variant"> on your turn</span></div></div>';
    if(need){
      const pend=profile.kyc_status==='pending';
      s.innerHTML=head+stats+'<div class="rounded-xl bg-surface-container-low p-4 flex gap-3 mb-4"><span class="material-symbols-outlined text-primary text-[26px]">'+(pend?'hourglass_top':'lock')+'</span><div><p class="font-label-lg text-label-lg">'+(pend?'Your verification is under review':'Verify your identity first')+'</p><p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">'+(pend?'You can join as soon as it is approved.':'Groups above '+App.money(THRESHOLD)+' per payment need a verified NIN or BVN.')+'</p></div></div>'+(pend?'':'<a href="kyc.html?next=groups.html" class="press w-full h-12 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg flex items-center justify-center gap-2">Verify with NIN or BVN<span class="material-symbols-outlined text-[20px]">arrow_forward</span></a>');
    }else{
      let sel=null;
      const inp='class="w-full h-12 px-4 rounded-xl bg-surface-container-low font-body-md text-body-md outline-none focus:ring-2 focus:ring-primary-container"';
      const nums=Array.from({length:g.max_members},(_,i)=>i+1).map(n=>{const t=(g.taken||[]).includes(n);return '<button data-n="'+n+'" class="num press h-11 rounded-xl font-label-lg text-label-lg '+(t?'bg-surface-container text-outline-variant line-through':'bg-surface-container-low text-on-surface')+'" data-t="'+(t?1:0)+'" type="button">'+n+'</button>'}).join('');
      s.innerHTML=head+stats+
        '<div class="flex flex-col gap-3 mb-4"><div><label class="font-label-md text-label-md block mb-1">Your full name</label><input id="nm" '+inp+' value="'+App.esc(profile.full_name)+'" autocomplete="name"/></div>'+
        '<p class="font-label-lg text-label-lg pt-1">Account where you will receive your payout</p>'+
        '<div><label class="font-label-md text-label-md block mb-1">Bank</label><input id="bk" list="banks" '+inp+' placeholder="e.g. Access Bank"/></div>'+
        '<div><label class="font-label-md text-label-md block mb-1">Account number</label><input id="ac" '+inp+' inputmode="numeric" maxlength="10" placeholder="10 digits"/></div>'+
        '<div><label class="font-label-md text-label-md block mb-1">Account name</label><input id="an" '+inp+' placeholder="Name on the account"/></div></div>'+
        '<label class="font-label-lg text-label-lg block mb-1">Pick your number</label><p class="font-body-sm text-body-sm text-on-surface-variant mb-2">Number 1 is paid first, then 2, and so on. Crossed-out numbers are taken.</p><div id="nums" class="grid grid-cols-5 gap-2 mb-1">'+nums+'</div><p id="nmsg" class="font-label-md text-label-md min-h-[18px] mb-2"></p>'+
        '<p id="err" class="font-body-sm text-body-sm text-error min-h-[16px] mb-1"></p><button id="ok" class="press w-full h-[52px] rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg shadow-lg flex items-center justify-center gap-2" type="button">Confirm &amp; join</button><button id="later" class="w-full mt-2 py-2 text-on-surface-variant font-label-md text-label-md" type="button">Maybe later</button>';
      const paint=()=>s.querySelectorAll('.num').forEach(b=>{const n=+b.dataset.n,t=b.dataset.t==='1';b.className='num press h-11 rounded-xl font-label-lg text-label-lg '+(t?'bg-surface-container text-outline-variant line-through':(n===sel?'bg-primary text-on-primary shadow-md':'bg-surface-container-low text-on-surface'))});
      s.querySelectorAll('.num').forEach(b=>b.onclick=()=>{
        if(b.dataset.t==='1'){$('nmsg').className='font-label-md text-label-md min-h-[18px] mb-2 text-error';$('nmsg').textContent='Number '+b.dataset.n+' is occupied. Pick another number.';b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);return}
        sel=+b.dataset.n;$('nmsg').className='font-label-md text-label-md min-h-[18px] mb-2 text-secondary';$('nmsg').textContent='You picked number '+sel+'.';paint()});
      $('ac').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,10);
      $('later').onclick=close;
      $('ok').onclick=async()=>{
        const nm=$('nm').value.trim(),bk=$('bk').value.trim(),ac=$('ac').value,an=$('an').value.trim(),err=$('err');
        const bad=t=>{err.textContent=t;s.classList.remove('shake');void s.offsetWidth;s.classList.add('shake')};
        if(nm.length<2)return bad('Enter your full name.');
        if(bk.length<2)return bad('Enter your bank.');
        if(!/^\d{10}$/.test(ac))return bad('Account number must be 10 digits.');
        if(an.length<2)return bad('Enter the account name.');
        if(!sel)return bad('Pick your number.');
        const b=$('ok');b.disabled=true;b.innerHTML='<span class="material-symbols-outlined animate-spin text-[20px]">progress_activity</span>Joining…';err.textContent='';
        const {error}=await sb.rpc('join_group',{p_group:g.id,p_slot:sel,p_name:nm,p_bank:bk,p_acct:ac,p_acct_name:an});
        if(error){
          if(/KYC_REQUIRED/.test(error.message)){close();App.toast('Verify your identity to join this group.',false);setTimeout(()=>location.href='kyc.html?next=groups.html',900);return}
          b.disabled=false;b.textContent='Confirm & join';
          if(/occupied/i.test(error.message)){const {data}=await sb.rpc('groups_overview');const f=(data||[]).find(x=>x.id===g.id);if(f){g.taken=f.taken;sel=null;openJoin(Object.assign(g,f));$('nmsg').className='font-label-md text-label-md min-h-[18px] mb-2 text-error';$('nmsg').textContent='Number occupied. Someone just took it, pick another.';return}}
          return bad(error.message);
        }
        b.className='w-full h-[52px] rounded-full bg-secondary text-on-secondary font-label-lg text-label-lg flex items-center justify-center gap-2 pop';b.innerHTML='<span class="material-symbols-outlined">check_circle</span>You joined with number '+sel;
        setTimeout(()=>location.href='group.html?id='+g.id,1100);
      };
    }
    $('x').onclick=close;m.classList.remove('hidden');m.classList.add('flex');
  }
  function close(){$('modal').classList.add('hidden');$('modal').classList.remove('flex')}
  $('modal').onclick=e=>{if(e.target.id==='modal')close()};
  load();
})();
</script></body></html>
