<!DOCTYPE html>
<html lang="en"><head><title>Group – Frantech Ajo</title>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</head>
<body class="invisible bg-surface font-body-md text-on-surface antialiased min-h-screen">
<header id="hdr"></header>
<main class="pt-16 pb-28 px-margin"><div id="view" class="flex flex-col gap-space-md pt-3"></div></main>
<nav id="nav"></nav>
<input id="file" type="file" accept="image/*,application/pdf" class="hidden"/>
<script>
(async()=>{
  const {user}=await App.init({title:'My group',active:'groups'});
  const $=id=>document.getElementById(id), view=$('view');
  const gid=new URLSearchParams(location.search).get('id');
  if(!gid){location.replace('groups.html');return}
  let g,acct,me,roster=[],contribs=[],payouts=[],uploadPeriod=null;

  async function load(){
    view.innerHTML='<div class="shimmer h-36 rounded-xl"></div><div class="shimmer h-28 rounded-xl"></div><div class="shimmer h-48 rounded-xl"></div>';
    const [o,a,m,r,c,p]=await Promise.all([
      sb.rpc('groups_overview'),
      sb.from('group_accounts').select('*').eq('group_id',gid).maybeSingle(),
      sb.from('group_members').select('*').eq('group_id',gid).eq('user_id',user.id).maybeSingle(),
      sb.rpc('group_roster',{p_group:gid}),
      sb.from('contributions').select('*').eq('group_id',gid).eq('user_id',user.id),
      sb.from('payouts').select('*').eq('group_id',gid)]);
    g=(o.data||[]).find(x=>x.id===gid);acct=a.data;me=m.data;roster=r.data||[];contribs=c.data||[];payouts=p.data||[];
    if(!g||!me){location.replace('groups.html');return}
    draw();
  }

  function stateOf(k,cur){
    const c=contribs.find(x=>x.period===k);
    if(c&&c.status==='confirmed')return {t:'confirmed',c};
    if(c&&c.status==='submitted')return {t:'review',c};
    if(c&&c.status==='rejected')return {t:'rejected',c};
    if(g.status==='active'&&k<=cur)return {t:'due'};
    return {t:'upcoming'};
  }

  function draw(){
    const cur=App.cur(g),pot=g.contribution_amount*g.max_members,per=App.per(g);
    const stat={open:['Waiting for members','bg-surface-container-high text-on-surface-variant'],active:['Running','bg-secondary-fixed/40 text-secondary'],completed:['Completed','bg-primary-fixed text-primary']}[g.status];
    const myTurn=g.status!=='open'?App.due(g,me.slot):null;
    let h='';
    h+='<section class="rise rounded-2xl bg-gradient-to-br from-primary-container via-primary to-[#002f9c] text-on-primary p-space-md shadow-[0_12px_30px_-6px_rgba(0,82,255,0.35)]" style="--i:0"><div class="flex items-start justify-between gap-2"><div><h1 class="font-headline-md text-headline-md leading-tight">'+App.esc(g.title)+'</h1><p class="font-body-sm text-body-sm text-on-primary-container mt-0.5">'+App.money(g.contribution_amount)+' every '+per+' · '+g.max_members+' members</p></div><span class="px-2.5 py-1 rounded-full font-label-sm text-label-sm font-semibold '+stat[1]+'">'+stat[0]+'</span></div><div class="grid grid-cols-2 gap-2 mt-4"><div class="rounded-xl bg-white/15 p-3"><p class="font-label-sm text-label-sm text-on-primary-container">Your number</p><p class="font-currency-display text-currency-display" id="myn">0</p></div><div class="rounded-xl bg-white/15 p-3"><p class="font-label-sm text-label-sm text-on-primary-container">You receive</p><p class="font-headline-sm text-headline-sm font-bold leading-9">'+App.money(pot)+'</p></div></div><p class="font-body-sm text-body-sm text-on-primary-container mt-3">'+(g.status==='open'?'Payments begin once all '+g.max_members+' numbers are taken and the admin starts the group ('+g.member_count+' of '+g.max_members+' joined).':'Your turn is period '+me.slot+', around '+App.fmtDate(myTurn)+'.')+'</p></section>';

    if(acct)h+='<section class="rise bg-surface-container-lowest rounded-xl p-space-md shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)]" style="--i:1"><div class="flex items-center justify-between mb-2"><h2 class="font-headline-sm text-headline-sm">Pay to this account</h2><span class="material-symbols-outlined text-primary">account_balance</span></div><div class="rounded-xl bg-surface-container-low p-3 flex flex-col gap-2"><div class="flex justify-between"><span class="font-label-sm text-label-sm text-on-surface-variant">Bank</span><span class="font-label-lg text-label-lg">'+App.esc(acct.bank_name)+'</span></div><div class="flex justify-between"><span class="font-label-sm text-label-sm text-on-surface-variant">Account name</span><span class="font-label-lg text-label-lg text-right">'+App.esc(acct.account_name)+'</span></div><div class="flex items-center justify-between"><div><span class="font-label-sm text-label-sm text-on-surface-variant block">Account number</span><span class="font-headline-md text-headline-md tracking-widest font-extrabold">'+App.esc(acct.account_number)+'</span></div><button id="cp" class="press flex items-center gap-1.5 px-3 py-2 rounded-full bg-primary-container text-on-primary font-label-md text-label-md" type="button"><span class="material-symbols-outlined text-[16px]">content_copy</span>Copy</button></div></div><p class="font-body-sm text-body-sm text-on-surface-variant mt-2">Send <strong>'+App.money(g.contribution_amount)+'</strong> each '+per+', then upload your receipt below.</p></section>';

    // Schedule
    h+='<section class="flex flex-col gap-space-sm"><h2 class="rise font-headline-sm text-headline-sm" style="--i:2">Payment schedule</h2>';
    for(let k=1;k<=g.max_members;k++){
      const st=g.status==='open'?{t:'upcoming'}:stateOf(k,cur),paid=payouts.find(x=>x.period===k),rc=roster.find(x=>x.slot===k);
      const dueTxt=g.status==='open'?'Starts when the group is full':'Due '+App.fmtDate(App.due(g,k));
      const chip={confirmed:['Paid','bg-secondary-fixed text-on-secondary-fixed','check_circle'],review:['In review','bg-primary-fixed text-primary','hourglass_top'],rejected:['Rejected','bg-error-container text-on-error-container','error'],due:['Due','bg-error-container text-on-error-container','schedule'],upcoming:['Upcoming','bg-surface-container-high text-on-surface-variant','event']}[st.t];
      const btn=(st.t==='due'||st.t==='rejected')?'<button data-up="'+k+'" class="press mt-2 w-full h-10 rounded-full bg-primary-container text-on-primary font-label-md text-label-md flex items-center justify-center gap-1.5" type="button"><span class="material-symbols-outlined text-[18px]">upload</span>'+(st.t==='rejected'?'Upload a new receipt':'Upload receipt')+'</button>':'';
      h+='<div class="rise rounded-xl bg-surface-container-lowest p-3.5 shadow-sm '+(k===cur&&g.status==='active'?'ring-2 ring-primary-container':'')+'" style="--i:'+Math.min(k+2,9)+'"><div class="flex items-center justify-between gap-2"><div class="flex items-center gap-3 min-w-0"><div class="w-10 h-10 rounded-full bg-surface-container text-on-surface flex items-center justify-center font-label-lg text-label-lg shrink-0">'+k+'</div><div class="min-w-0"><p class="font-label-lg text-label-lg truncate">Period '+k+(k===me.slot?' · <span class="text-primary">your turn</span>':'')+'</p><p class="font-body-sm text-body-sm text-on-surface-variant">'+dueTxt+'</p></div></div><span class="px-2.5 py-1 rounded-full font-label-sm text-label-sm font-semibold flex items-center gap-1 shrink-0 '+chip[1]+'"><span class="material-symbols-outlined text-[14px]">'+chip[2]+'</span>'+chip[0]+'</span></div>'+
        '<p class="font-body-sm text-body-sm text-on-surface-variant mt-1.5">Receiver: <strong class="text-on-surface">'+App.esc(rc?rc.full_name:'—')+'</strong>'+(paid?' · <span class="text-secondary font-semibold">Payout sent</span>':'')+'</p>'+
        (st.t==='rejected'&&st.c.note?'<p class="font-body-sm text-body-sm text-error mt-1">'+App.esc(st.c.note)+'</p>':'')+btn+'</div>';
    }
    h+='</section>';

    // Roster + my payout account
    h+='<section class="rise bg-surface-container-lowest rounded-xl p-space-md shadow-sm" style="--i:9"><h2 class="font-headline-sm text-headline-sm mb-2">Members</h2><div class="flex flex-col gap-1.5">'+Array.from({length:g.max_members},(_,i)=>i+1).map(n=>{const r=roster.find(x=>x.slot===n);return '<div class="flex items-center justify-between py-1"><div class="flex items-center gap-2.5"><span class="w-7 h-7 rounded-full '+(r?'bg-primary-fixed text-primary':'bg-surface-container text-outline')+' flex items-center justify-center font-label-md text-label-md">'+n+'</span><span class="font-body-md text-body-md '+(r?'':'text-outline')+'">'+(r?App.esc(r.full_name)+(r.user_id===user.id?' (you)':''):'Not taken yet')+'</span></div></div>'}).join('')+'</div></section>';
    h+='<section class="rise rounded-xl bg-surface-container-low p-space-md" style="--i:10"><p class="font-label-lg text-label-lg mb-1">Your payout account</p><p class="font-body-sm text-body-sm text-on-surface-variant">'+App.esc(me.bank_name)+' · '+App.esc(me.account_number)+' · '+App.esc(me.account_name)+'</p></section>';
    view.innerHTML=h;
    App.count($('myn'),me.slot);
    if($('cp'))$('cp').onclick=()=>App.copy(acct.account_number);
    view.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>{uploadPeriod=+b.dataset.up;$('file').value='';$('file').click()});
  }

  // Shrink photos before upload so they are quick on mobile data
  function shrink(f){return new Promise(res=>{
    if(!f.type.startsWith('image/'))return res(f);
    const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{const s=Math.min(1,1600/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*s);c.height=Math.round(img.height*s);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>res(b?new File([b],'receipt.jpg',{type:'image/jpeg'}):f),'image/jpeg',.82)};
    img.onerror=()=>res(f);img.src=u})}

  $('file').onchange=async e=>{
    const f0=e.target.files[0];if(!f0||!uploadPeriod)return;
    if(f0.size>15*1024*1024)return App.toast('File is too large. Use a smaller image.',false);
    const btn=view.querySelector('[data-up="'+uploadPeriod+'"]');
    if(btn){btn.disabled=true;btn.innerHTML='<span class="material-symbols-outlined animate-spin text-[18px]">progress_activity</span>Uploading…'}
    const f=await shrink(f0),ext=f.type==='application/pdf'?'pdf':(f.type==='image/png'?'png':'jpg');
    const path=user.id+'/'+gid+'/p'+uploadPeriod+'-'+Date.now()+'.'+ext;
    const up=await sb.storage.from('receipts').upload(path,f,{contentType:f.type,upsert:false});
    if(up.error){App.toast('Upload failed. Check your connection and try again.',false);return load()}
    const {error}=await sb.rpc('submit_receipt',{p_group:gid,p_period:uploadPeriod,p_path:path});
    if(error){App.toast(error.message,false);return load()}
    App.toast('Receipt sent. The admin will confirm your payment.');
    await load();
  };
  load();
})();
</script></body></html>
