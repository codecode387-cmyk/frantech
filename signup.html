<!DOCTYPE html>
<html lang="en"><head><title>Join Frantech Ajo</title>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#00319E}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#131b2e}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(20px + env(safe-area-inset-bottom,0));background:linear-gradient(#0052FF,#0047E0 55%,#00319E)}
.back{color:#fff;opacity:.9;text-decoration:none;font-size:14px;margin-bottom:22px;width:fit-content}
h1{color:#fff;font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:rgba(255,255,255,.8);font-size:14px;margin:0 0 20px}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(26px)}}
form{display:flex;flex-direction:column;gap:12px}
input[type=text],input[type=email],input[type=tel],input[type=password]{width:100%;height:50px;border-radius:14px;border:1.5px solid #c3c5d9;padding:0 14px;font:500 15px 'Plus Jakarta Sans',sans-serif;color:#131b2e;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#0052FF;box-shadow:0 0 0 3px rgba(0,82,255,.18)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;height:38px;padding:0 10px;border:0;background:none;color:#0052FF;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.primary{height:52px;border:0;border-radius:999px;background:#0052FF;color:#fff;font:700 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer;transition:transform .15s}
.primary:active{transform:scale(.98)}.primary:disabled{opacity:.6}
.ghost{height:52px;border-radius:999px;border:1.5px solid #0052FF;background:#fff;color:#0052FF;font:700 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.link{background:none;border:0;color:#0052FF;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer;padding:4px}
.msg{font-size:13px;min-height:18px;margin:0}.err{color:#ba1a1a}.ok{color:#006c47}
.foot{text-align:center;font-size:14px;color:#434656;margin:14px 0 0}.foot a{color:#0052FF;font-weight:700;text-decoration:none}
.chk{display:flex;gap:8px;font-size:12px;color:#434656;align-items:flex-start}.chk input{margin-top:2px;accent-color:#0052FF}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.hide{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body><main>
<a class="back" href="index.html">&larr; Back</a>
<h1>Create your account</h1><p class="sub">Join a savings circle with people you trust.</p>
<div class="card"><form id="f" novalidate>
  <input id="name" type="text" placeholder="Full name" autocomplete="name"/>
  <input id="phone" type="tel" placeholder="Phone number (0803 123 4567)" autocomplete="tel"/>
  <input id="email" type="email" placeholder="Email address" autocomplete="email"/>
  <div class="pw"><input id="pass" type="password" placeholder="Password (min. 8 characters)" autocomplete="new-password"/><button type="button" id="eye">Show</button></div>
  <label class="chk"><input type="checkbox" id="terms"/>I agree to the Terms of Service and Privacy Policy.</label>
  <p class="msg" id="msg" role="status"></p>
  <button class="primary" id="go">Create account</button>
</form>
<p class="foot">Already have an account? <a href="login.html">Log in</a></p></div>
</main>
<script>
const $=i=>document.getElementById(i);
function say(t,ok){$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err")}
function fail(t){say(t);const f=$("f");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")}
$("eye").onclick=()=>{const p=$("pass"),s=p.type==="password";p.type=s?"text":"password";$("eye").textContent=s?"Hide":"Show"};
sb.auth.getSession().then(({data})=>{if(data.session)location.replace("login.html")});
$("f").onsubmit=async e=>{
  e.preventDefault();
  const name=$("name").value.trim(),phone=$("phone").value.trim(),email=$("email").value.trim(),password=$("pass").value;
  if(name.length<2)return fail("Enter your full name.");
  if(!/^(\+?234|0)\d{10}$/.test(phone.replace(/[\s-]/g,"")))return fail("Enter a valid Nigerian phone number.");
  if(!/^\S+@\S+\.\S+$/.test(email))return fail("Enter a valid email address.");
  if(password.length<8)return fail("Password must be at least 8 characters.");
  if(!$("terms").checked)return fail("Accept the terms to continue.");
  const b=$("go");b.disabled=true;b.textContent="Creating account…";say("");
  const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:name,phone}}});
  if(error){b.disabled=false;b.textContent="Create account";return fail(/already registered/i.test(error.message)?"This email already has an account. Log in instead.":error.message)}
  if(data.session){sessionStorage.setItem("frantech_unlocked","1");say("Account created. Taking you in…",true);setTimeout(()=>location.href="dashboard.html",700)}
  else{say("Account created. Log in to continue.",true);setTimeout(()=>location.href="login.html",1200)}
};
</script></body></html>
