<!DOCTYPE html>
<html lang="en"><head><title>Home – Frantech Ajo</title>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</head>
<body class="invisible bg-surface font-body-md text-on-surface antialiased min-h-screen">
<header id="hdr"></header>
<main class="pt-16 pb-28 px-margin"><div class="flex flex-col w-full gap-space-lg pb-6 pt-2">

  <section class="rise flex flex-col" style="--i:0">
    <span id="greet" class="font-label-md text-label-md text-on-surface-variant"></span>
    <h1 class="font-headline-lg text-headline-lg tracking-tight mt-0.5 flex items-center gap-1.5"><span id="uname"></span><span class="wave text-xl select-none">👋</span></h1>
    <p class="font-body-md text-body-md text-on-surface-variant mt-1">Keep saving, your goals are closer than you think!</p>
  </section>

  <div id="nudges" class="flex flex-col gap-space-sm"></div>

  <section class="rise relative w-full rounded-2xl bg-gradient-to-br from-primary-container via-primary to-[#002f9c] text-on-primary p-space-md shadow-[0_12px_30px_-6px_rgba(0,82,255,0.35)] overflow-hidden" style="--i:2">
    <div class="absolute -right-12 -top-12 w-48 h-48 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
    <div class="absolute -left-10 -bottom-10 w-40 h-40 rounded-full bg-secondary-fixed/15 blur-xl pointer-events-none"></div>
    <div class="relative z-10 flex flex-col gap-space-sm">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-space-xs"><span class="font-label-md text-label-md text-on-primary-container tracking-wide">Total Contribution</span>
          <button id="eye" aria-label="Hide amount" class="p-1 rounded-full text-on-primary-container hover:bg-white/10 press flex items-center" type="button"><span id="eyeI" class="material-symbols-outlined text-[18px]">visibility</span></button></div>
        <div class="w-8 h-8 rounded-full bg-white/15 backdrop-blur-md flex items-center justify-center"><span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">account_balance_wallet</span></div>
      </div>
      <span id="amt" class="font-currency-display text-currency-display tracking-tight select-none">₦0</span>
      <div class="flex items-center justify-between pt-1">
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/15 backdrop-blur-md"><span class="w-2 h-2 rounded-full bg-secondary-fixed animate-ping"></span><span id="ag" class="font-label-sm text-label-sm font-medium">Active Groups: 0</span></div>
        <span class="font-label-sm text-label-sm text-on-primary-container font-medium">Confirmed payments</span>
      </div>
    </div>
  </section>

  <section class="rise grid grid-cols-4 gap-space-xs px-0.5" style="--i:3" id="actions"></section>

  <section class="flex flex-col gap-space-sm">
    <div class="rise flex items-center justify-between" style="--i:4"><h2 class="font-headline-sm text-headline-sm">My Groups</h2><a href="groups.html" class="font-label-md text-label-md text-primary font-semibold flex items-center gap-0.5">Find groups<span class="material-symbols-outlined text-[16px]">arrow_forward</span></a></div>
    <div id="mine" class="flex flex-col gap-space-sm"></div>
  </section>
</div></main>
<nav id="nav"></nav>
<script>
(async()=>{
  const {profile,user}=await App.init({title:'Home',active:'home'});
  const $=id=>document.getElementById(id), k=profile.kyc_status;
  const h=new Date().getHours();
  $('greet').textContent=(h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening')+',';
  $('uname').textContent=profile.full_name;

  const act=(href,ic,lb)=>'<a href="'+href+'" class="group press flex flex-col items-center gap-1.5 text-center"><div class="w-14 h-14 rounded-2xl bg-surface-container-low shadow-[0_4px_16px_-2px_rgba(15,23,42,0.06)] flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary transition-all"><span class="material-symbols-outlined text-[26px]">'+ic+'</span></div><span class="font-label-sm text-label-sm font-semibold leading-tight">'+lb+'</span></a>';
  $('actions').innerHTML=act('groups.html','person_add','Join Group')+act('groups.html#mine','diversity_3','My Groups')+act('kyc.html',k==='verified'?'verified':'verified_user',k==='verified'?'Verified':'Verify ID')+act('#','notifications','Alerts');
  $('actions').lastElementChild.onclick=e=>{e.preventDefault();App.openNotifs()};

  let hid=false,amount=0;
  $('eye').onclick=()=>{hid=!hid;$('amt').textContent=hid?'₦ • • • • • •':App.money(amount);$('eyeI').textContent=hid?'visibility_off':'visibility'};

  const nz=$('nudges');
  if(k==='none'||k==='rejected')nz.innerHTML+='<a href="kyc.html" class="rise press flex items-center gap-3 rounded-xl bg-surface-container-low p-3.5" style="--i:1"><div class="w-10 h-10 rounded-full bg-primary-fixed text-primary flex items-center justify-center pulse-ring"><span class="material-symbols-outlined text-[22px]">verified_user</span></div><div class="flex-1"><p class="font-label-lg text-label-lg">Verify your identity</p><p class="font-body-sm text-body-sm text-on-surface-variant">Needed for groups with larger payments.</p></div><span class="material-symbols-outlined text-outline">chevron_right</span></a>';
  if(await bio.supported()&&!bio.enabledFor(user.id)&&!localStorage.getItem('frantech_bio_dismissed')){
    const d=document.createElement('div');d.className='rise flex items-center gap-3 rounded-xl bg-surface-container-lowest p-3.5 shadow-sm';d.style.setProperty('--i',1);
    d.innerHTML='<span class="material-symbols-outlined text-primary text-[26px]">fingerprint</span><div class="flex-1"><p class="font-label-lg text-label-lg">Log in faster</p><p class="font-body-sm text-body-sm text-on-surface-variant">Use Face ID or your fingerprint.</p></div><button id="bOn" class="press px-3 py-1.5 rounded-full bg-primary text-on-primary font-label-md text-label-md" type="button">Turn on</button><button id="bNo" aria-label="Dismiss" class="text-outline" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button>';
    nz.appendChild(d);
    $('bNo').onclick=()=>{localStorage.setItem('frantech_bio_dismissed','1');d.remove()};
    $('bOn').onclick=async()=>{try{await bio.enable(user);sessionStorage.setItem('frantech_unlocked','1');d.remove();App.toast('Face ID / fingerprint is on.')}catch(e){App.toast('Could not turn it on on this device.',false)}};
  }

  $('mine').innerHTML='<div class="shimmer h-28 rounded-2xl"></div><div class="shimmer h-28 rounded-2xl"></div>';
  const [o,c]=await Promise.all([sb.rpc('groups_overview'),sb.from('contributions').select('group_id,period,amount,status,note').eq('user_id',user.id)]);
  if(o.error){$('mine').innerHTML='<div class="rounded-xl bg-error-container text-on-error-container p-4 font-body-sm text-body-sm">Could not load your groups. Run admin-setup.sql in Supabase first.</div>';return}
  const mine=(o.data||[]).filter(g=>g.joined&&g.status!=='completed'),contribs=c.data||[];
  amount=contribs.filter(x=>x.status==='confirmed').reduce((s,x)=>s+Number(x.amount),0);
  App.count($('amt'),amount,App.money);$('ag').textContent='Active Groups: '+mine.length;

  // The big "payment due" alert
  const info=g=>{
    if(g.status==='open')return {c:'bg-surface-container-high text-on-surface-variant',ic:'hourglass_empty',t:'Waiting for members ('+g.member_count+'/'+g.max_members+')'};
    const cur=App.cur(g);
    if(cur===0)return {c:'bg-primary-fixed text-primary',ic:'event',t:'Starts '+App.fmtDate(new Date(g.start_date+'T00:00:00'))};
    const x=contribs.find(y=>y.group_id===g.id&&y.period===cur);
    if(x&&x.status==='confirmed'){
      const nx=cur<g.max_members?App.due(g,cur+1):null;
      return {c:'bg-secondary-fixed text-on-secondary-fixed',ic:'check_circle',t:'Paid for period '+cur+(nx?' · next '+App.fmtDate(nx):''),paid:true};
    }
    if(x&&x.status==='submitted')return {c:'bg-primary-fixed text-primary',ic:'hourglass_top',t:'Receipt under review'};
    if(x&&x.status==='rejected')return {c:'bg-error-container text-on-error-container',ic:'error',t:'Receipt rejected. Upload again',alert:true};
    const d=App.daysTo(App.due(g,cur));
    return {c:'bg-error-container text-on-error-container',ic:'schedule',t:d===0?'Payment due today':'Overdue by '+Math.abs(d)+' day'+(Math.abs(d)>1?'s':''),alert:true};
  };
  const first=mine.map(g=>({g,i:info(g)})).find(x=>x.i.alert);
  if(first)nz.insertAdjacentHTML('afterbegin','<a href="group.html?id='+first.g.id+'" class="rise press flex items-center gap-3 rounded-xl bg-error-container text-on-error-container p-3.5" style="--i:1"><span class="material-symbols-outlined text-[26px]">notification_important</span><div class="flex-1"><p class="font-label-lg text-label-lg">'+App.esc(first.i.t)+'</p><p class="font-body-sm text-body-sm">'+App.esc(first.g.title)+' · '+App.money(first.g.contribution_amount)+'. Tap to pay and upload your receipt.</p></div><span class="material-symbols-outlined">chevron_right</span></a>');

  $('mine').innerHTML=mine.length?mine.map((g,i)=>{const s=info(g),cur=App.cur(g);
    return '<a href="group.html?id='+g.id+'" class="rise press block w-full rounded-2xl bg-surface-container-lowest p-space-md shadow-[0_4px_18px_-2px_rgba(15,23,42,0.05)]" style="--i:'+(5+Math.min(i,4))+'"><div class="flex items-start justify-between gap-2"><div class="min-w-0"><h3 class="font-headline-sm text-headline-sm truncate">'+App.esc(g.title)+'</h3><p class="font-body-sm text-body-sm text-on-surface-variant">'+App.money(g.contribution_amount)+' per '+App.per(g)+' · Your number <strong class="text-on-surface">'+g.my_slot+'</strong>'+(cur===g.my_slot?' · <span class="text-primary font-semibold">your turn</span>':'')+'</p></div><span class="material-symbols-outlined text-outline">chevron_right</span></div><div class="mt-3 inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full font-label-md text-label-md '+s.c+'"><span class="material-symbols-outlined text-[16px]">'+s.ic+'</span>'+App.esc(s.t)+'</div></a>'}).join(''):'<div class="rise flex flex-col items-center text-center py-10 px-4 bg-surface-container-lowest rounded-2xl"><div class="w-14 h-14 rounded-full bg-surface-container flex items-center justify-center text-outline mb-3"><span class="material-symbols-outlined text-[28px]">savings</span></div><h4 class="font-headline-sm text-headline-sm">You have not joined a group yet</h4><p class="font-body-sm text-body-sm text-on-surface-variant max-w-xs mt-1">Pick a group, choose your number and start saving.</p><a href="groups.html" class="press mt-4 px-5 py-2.5 rounded-full bg-primary text-on-primary font-label-md text-label-md">Browse groups</a></div>';
})();
</script></body></html>
