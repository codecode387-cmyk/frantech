<!DOCTYPE html>
<html lang="en"><head><title>Home – Frantech Ajo</title>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</head>
<body class="invisible bg-surface font-body-md text-on-surface antialiased min-h-screen">
<header id="hdr"></header>
<main class="pt-16 pb-28 px-margin"><div class="flex flex-col w-full gap-space-lg pb-6 pt-2">

  <section class="rise flex flex-col" style="--i:0">
    <span id="greet" class="font-label-md text-label-md text-on-surface-variant"></span>
    <h1 class="font-headline-lg text-headline-lg tracking-tight mt-0.5 flex items-center gap-1.5"><span id="uname"></span><span class="wave text-xl select-none">👋</span></h1>
    <p class="font-body-md text-body-md text-on-surface-variant mt-1">Keep saving, your goals are closer than you think!</p>
  </section>

  <div id="nudges" class="flex flex-col gap-space-sm"></div>

  <section class="rise relative w-full rounded-2xl bg-gradient-to-br from-primary-container via-primary to-[#002f9c] text-on-primary p-space-md shadow-[0_12px_30px_-6px_rgba(0,82,255,0.35)] overflow-hidden" style="--i:2">
    <div class="absolute -right-12 -top-12 w-48 h-48 rounded-full bg-white/10 blur-2xl pointer-events-none"></div>
    <div class="absolute -left-10 -bottom-10 w-40 h-40 rounded-full bg-secondary-fixed/15 blur-xl pointer-events-none"></div>
    <div class="relative z-10 flex flex-col gap-space-sm">
      <div class="flex items-center justify-between">
        <div class="flex items-center gap-space-xs"><span class="font-label-md text-label-md text-on-primary-container tracking-wide">Monthly Commitment</span>
          <button id="eye" aria-label="Hide amount" class="p-1 rounded-full text-on-primary-container hover:bg-white/10 press flex items-center" type="button"><span id="eyeI" class="material-symbols-outlined text-[18px]">visibility</span></button></div>
        <div class="w-8 h-8 rounded-full bg-white/15 backdrop-blur-md flex items-center justify-center"><span class="material-symbols-outlined text-[18px]" style="font-variation-settings:'FILL' 1">account_balance_wallet</span></div>
      </div>
      <span id="amt" class="font-currency-display text-currency-display tracking-tight select-none">₦0</span>
      <div class="flex items-center justify-between pt-1">
        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-white/15 backdrop-blur-md"><span class="w-2 h-2 rounded-full bg-secondary-fixed animate-ping"></span><span id="ag" class="font-label-sm text-label-sm font-medium">Active Groups: 0</span></div>
        <span id="vflag" class="font-label-sm text-label-sm text-on-primary-container font-medium flex items-center gap-0.5"></span>
      </div>
    </div>
  </section>

  <section class="rise grid grid-cols-4 gap-space-xs px-0.5" style="--i:3" id="actions"></section>

  <section class="flex flex-col gap-space-sm">
    <div class="rise flex items-center justify-between" style="--i:4"><h2 class="font-headline-sm text-headline-sm">Popular Groups</h2><a href="groups.html" class="font-label-md text-label-md text-primary font-semibold flex items-center gap-0.5">See All<span class="material-symbols-outlined text-[16px]">arrow_forward</span></a></div>
    <div id="pop" class="flex flex-col gap-space-sm"></div>
  </section>
</div></main>
<nav id="nav"></nav>
<script>
(async()=>{
  const {profile,user}=await App.init({title:'Home',active:'home'});
  const $=id=>document.getElementById(id), k=profile.kyc_status;
  const h=new Date().getHours();
  $('greet').textContent=(h<12?'Good Morning':h<17?'Good Afternoon':'Good Evening')+',';
  $('uname').textContent=profile.full_name;

  // Quick actions
  const act=(href,ic,lb,fill)=>'<a href="'+href+'" class="group press flex flex-col items-center gap-1.5 text-center"><div class="w-14 h-14 rounded-2xl bg-surface-container-low shadow-[0_4px_16px_-2px_rgba(15,23,42,0.06)] flex items-center justify-center text-primary group-hover:bg-primary-container group-hover:text-on-primary transition-all"><span class="material-symbols-outlined text-[26px]"'+(fill?' style="font-variation-settings:\'FILL\' 1"':'')+'>'+ic+'</span></div><span class="font-label-sm text-label-sm font-semibold leading-tight">'+lb+'</span></a>';
  $('actions').innerHTML=act('groups.html','person_add','Join Group')+act('groups.html#mine','diversity_3','My Groups')+act('kyc.html',k==='verified'?'verified':'verified_user',k==='verified'?'Verified':'Verify ID',true)+act('#','account_balance_wallet','Wallet',true);
  $('actions').lastElementChild.onclick=e=>{e.preventDefault();App.toast('Wallet opens once payments are connected.')};
  $('vflag').innerHTML=k==='verified'?'<span>ID verified</span><span class="material-symbols-outlined text-[14px]">verified</span>':(k==='pending'?'<span>Verification in review</span>':'<span>ID not verified</span>');

  // Balance eye
  let hid=false,amount=0;
  $('eye').onclick=()=>{hid=!hid;$('amt').textContent=hid?'₦ • • • • • •':App.money(amount);$('eyeI').textContent=hid?'visibility_off':'visibility'};

  // Nudges
  const nz=$('nudges');
  if(k==='none'||k==='rejected')nz.innerHTML+='<a href="kyc.html" class="rise press flex items-center gap-3 rounded-xl bg-surface-container-low p-3.5" style="--i:1"><div class="w-10 h-10 rounded-full bg-primary-fixed text-primary flex items-center justify-center pulse-ring"><span class="material-symbols-outlined text-[22px]">verified_user</span></div><div class="flex-1"><p class="font-label-lg text-label-lg">Verify your identity</p><p class="font-body-sm text-body-sm text-on-surface-variant">Add your NIN or BVN to start joining groups.</p></div><span class="material-symbols-outlined text-outline">chevron_right</span></a>';
  if(k==='pending')nz.innerHTML+='<a href="kyc.html" class="rise press flex items-center gap-3 rounded-xl bg-surface-container-low p-3.5" style="--i:1"><span class="material-symbols-outlined text-primary text-[26px]">hourglass_top</span><div class="flex-1"><p class="font-label-lg text-label-lg">Verification under review</p><p class="font-body-sm text-body-sm text-on-surface-variant">Tap to check the status.</p></div></a>';
  if(await bio.supported()&&!bio.enabledFor(user.id)&&!localStorage.getItem('frantech_bio_dismissed')){
    const d=document.createElement('div');d.className='rise flex items-center gap-3 rounded-xl bg-surface-container-lowest p-3.5 shadow-sm';d.style.setProperty('--i',1);
    d.innerHTML='<span class="material-symbols-outlined text-primary text-[26px]">fingerprint</span><div class="flex-1"><p class="font-label-lg text-label-lg">Log in faster</p><p class="font-body-sm text-body-sm text-on-surface-variant">Use Face ID or your fingerprint.</p></div><button id="bOn" class="press px-3 py-1.5 rounded-full bg-primary text-on-primary font-label-md text-label-md" type="button">Turn on</button><button id="bNo" aria-label="Dismiss" class="text-outline" type="button"><span class="material-symbols-outlined text-[20px]">close</span></button>';
    nz.appendChild(d);
    $('bNo').onclick=()=>{localStorage.setItem('frantech_bio_dismissed','1');d.remove()};
    $('bOn').onclick=async()=>{try{await bio.enable(user);sessionStorage.setItem('frantech_unlocked','1');d.remove();App.toast('Face ID / fingerprint is on.')}catch(e){App.toast('Could not turn it on on this device.',false)}};
  }

  // Groups data
  $('pop').innerHTML=[0,1,2].map(()=>'<div class="shimmer h-24 rounded-2xl"></div>').join('');
  const {data,error}=await sb.rpc('groups_overview');
  if(error){$('pop').innerHTML='<div class="rounded-xl bg-error-container text-on-error-container p-4 font-body-sm text-body-sm">Could not load groups. Run the SQL setup in Supabase first.</div>';return}
  const all=(data||[]).filter(g=>g.status==='active'),mine=all.filter(g=>g.joined);
  amount=mine.reduce((s,g)=>s+Math.floor(g.target_amount/g.months),0);
  App.count($('amt'),amount,App.money);$('ag').textContent='Active Groups: '+mine.length;
  const ICON={land:'landscape',business:'storefront',education:'school',travel:'flight',family:'family_restroom'};
  const top=all.slice().sort((a,b)=>b.member_count-a.member_count).slice(0,3);
  $('pop').innerHTML=top.map((g,i)=>{const pct=Math.round(g.member_count/g.max_members*100);
    return '<a href="groups.html" class="rise press block w-full rounded-2xl bg-surface-container-lowest p-space-md shadow-[0_4px_18px_-2px_rgba(15,23,42,0.05)]" style="--i:'+(5+i)+'"><div class="flex items-start gap-space-md"><div class="w-14 h-14 rounded-xl bg-primary-fixed text-primary flex items-center justify-center shrink-0"><span class="material-symbols-outlined text-[28px]">'+(ICON[g.category]||'groups')+'</span></div><div class="flex-1 min-w-0"><div class="flex items-center justify-between gap-1"><h3 class="font-headline-sm text-headline-sm truncate">'+App.esc(g.title)+'</h3>'+(g.joined?'<span class="px-2 py-0.5 rounded-full bg-primary-fixed text-primary font-label-sm text-label-sm font-semibold">Joined</span>':'<span class="px-2 py-0.5 rounded-full bg-secondary-fixed/40 text-on-secondary-fixed-variant font-label-sm text-label-sm font-semibold">Active</span>')+'</div><p class="font-body-sm text-body-sm text-on-surface-variant mt-0.5">'+App.money(g.target_amount)+' <span class="text-outline">•</span> '+g.months+' Months</p><div class="mt-2.5 flex items-center gap-space-sm"><div class="flex-1 h-2 rounded-full bg-surface-container overflow-hidden"><div class="bar h-full bg-primary-container rounded-full" style="width:0" data-w="'+pct+'"></div></div><span class="font-label-sm text-label-sm text-on-surface-variant font-semibold">'+pct+'%</span></div></div></div></a>'}).join('')||'<p class="font-body-md text-body-md text-on-surface-variant">No groups yet.</p>';
  requestAnimationFrame(()=>requestAnimationFrame(()=>$('pop').querySelectorAll('.bar').forEach(b=>b.style.width=b.dataset.w+'%')));
})();
</script></body></html>
