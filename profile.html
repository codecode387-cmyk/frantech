<!DOCTYPE html>
<html lang="en"><head><title>Profile – Frantech Ajo</title>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com/3.4.17"></script><script src="theme.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script><script src="app.js"></script>
</head>
<body class="invisible bg-surface font-body-md text-on-surface antialiased min-h-screen">
<header id="hdr"></header>
<main class="pt-16 pb-28 px-margin"><div class="flex flex-col w-full pt-4 gap-5">
  <div class="rise w-full bg-surface-container-lowest rounded-xl p-5 shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)] flex flex-col items-center text-center" style="--i:0">
    <div class="relative mb-3"><div id="av" class="w-24 h-24 rounded-full bg-primary-container text-on-primary flex items-center justify-center font-headline-xl text-headline-xl shadow-sm"></div><div id="avBadge" class="hidden absolute bottom-0 right-1 w-7 h-7 rounded-full bg-secondary text-on-secondary items-center justify-center shadow-md pop"><span class="material-symbols-outlined text-[16px]" style="font-variation-settings:'FILL' 1">verified</span></div></div>
    <div class="flex items-center gap-1.5 mb-1"><h2 id="nm" class="font-headline-md text-headline-md"></h2><span id="tier" class="px-2 py-0.5 rounded-full font-label-sm text-label-sm"></span></div>
    <div class="flex flex-col items-center gap-1 text-on-surface-variant font-body-sm text-body-sm mt-1"><div id="ph" class="flex items-center gap-1.5"></div><div class="flex items-center gap-1.5"><span class="material-symbols-outlined text-[15px] text-tertiary">mail</span><span id="em"></span></div></div>
  </div>

  <div id="kyc" class="rise" style="--i:1"></div>

  <div class="rise grid grid-cols-2 gap-2.5" style="--i:2">
    <div class="bg-surface-container-lowest rounded-xl p-3.5 text-center shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)]"><span id="sGroups" class="font-headline-lg text-headline-lg text-primary leading-tight block">0</span><span class="font-label-md text-label-md text-on-surface-variant">Groups joined</span></div>
    <div class="bg-surface-container-lowest rounded-xl p-3.5 text-center shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)]"><span id="sMonthly" class="font-headline-sm text-headline-sm font-bold leading-tight block py-1">₦0</span><span class="font-label-md text-label-md text-on-surface-variant">Monthly commitment</span></div>
  </div>

  <div class="rise flex flex-col gap-2" style="--i:3">
    <h3 class="font-headline-sm text-headline-sm px-1">Security</h3>
    <div class="w-full bg-surface-container-lowest rounded-xl shadow-[0_4px_20px_-2px_rgba(15,23,42,0.05)] overflow-hidden">
      <div id="bioRow" class="hidden px-4 py-3.5 items-center justify-between"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-surface-container-high text-primary flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">fingerprint</span></div><div class="flex flex-col"><span class="font-body-lg text-body-lg">Face ID / fingerprint</span><span class="font-label-sm text-label-sm text-on-surface-variant">Unlock the app without a password</span></div></div>
        <button id="bioSw" role="switch" aria-checked="false" class="w-12 h-6 rounded-full bg-surface-container-highest p-0.5 flex items-center transition-colors" type="button"><div id="bioKnob" class="w-5 h-5 rounded-full bg-surface-container-lowest shadow-sm transition-transform"></div></button></div>
      <button id="lock" class="hidden w-full px-4 py-3.5 items-center justify-between hover:bg-surface-container-low text-left" type="button"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-surface-container-high text-primary flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">lock</span></div><span class="font-body-lg text-body-lg">Lock app</span></div><span class="material-symbols-outlined text-[20px] text-outline-variant">chevron_right</span></button>
      <button id="out" class="w-full px-4 py-3.5 flex items-center justify-between hover:bg-error-container/20 text-left" type="button"><div class="flex items-center gap-3"><div class="w-9 h-9 rounded-lg bg-error-container text-error flex items-center justify-center"><span class="material-symbols-outlined text-[20px]">logout</span></div><span class="font-body-lg text-body-lg text-error font-medium">Log out</span></div><span class="material-symbols-outlined text-[20px] text-error">chevron_right</span></button>
    </div>
  </div>

  <div class="rise w-full py-3 flex flex-col items-center text-center gap-1" style="--i:4"><div class="flex items-center gap-1.5 text-primary"><span class="material-symbols-outlined text-[20px]">diversity_3</span><span class="font-headline-sm text-headline-sm font-bold">Frantech Ajo</span></div><p class="font-body-sm text-body-sm text-on-surface-variant">Together We Contribute For A Better Tomorrow</p></div>
</div></main>
<nav id="nav"></nav>
<script>
(async()=>{
  const {profile,user}=await App.init({title:'Profile',active:'profile'});
  const $=id=>document.getElementById(id), k=profile.kyc_status;
  $('av').textContent=App.initials(profile.full_name);$('nm').textContent=profile.full_name;$('em').textContent=profile.email||user.email;
  $('ph').innerHTML=profile.phone?'<span class="material-symbols-outlined text-[15px] text-primary">phone_iphone</span><span>'+App.esc(profile.phone)+'</span>':'';
  const t=$('tier');
  if(k==='verified'){t.textContent='Verified';t.className='px-2 py-0.5 rounded-full bg-secondary-fixed text-on-secondary-fixed font-label-sm text-label-sm';$('avBadge').classList.remove('hidden');$('avBadge').classList.add('flex')}
  else{t.textContent=k==='pending'?'In review':'Not verified';t.className='px-2 py-0.5 rounded-full bg-surface-container-high text-on-surface-variant font-label-sm text-label-sm'}

  const kc=$('kyc');
  if(k==='verified')kc.innerHTML='<div class="w-full bg-surface-container-low rounded-xl p-4 flex items-center justify-between"><div class="flex items-center gap-3"><div class="w-10 h-10 rounded-full bg-secondary-fixed text-on-secondary-fixed flex items-center justify-center"><span class="material-symbols-outlined text-[22px]">badge</span></div><div class="flex flex-col"><span class="font-headline-sm text-headline-sm leading-snug">'+(profile.kyc_type==='bvn'?'BVN':'NIN')+' verified</span><span class="font-body-sm text-body-sm text-on-surface-variant">Ending '+App.esc(profile.kyc_last4||'••••')+'</span></div></div><span class="px-2.5 py-1 rounded-full bg-secondary text-on-secondary font-label-sm text-label-sm flex items-center gap-1"><span class="material-symbols-outlined text-[14px]">check_circle</span>Active</span></div>';
  else kc.innerHTML='<a href="kyc.html" class="press block w-full bg-gradient-to-r from-primary to-primary-container text-on-primary rounded-xl p-4 shadow-[0_10px_25px_-4px_rgba(0,82,255,0.22)]"><div class="flex items-center gap-3"><span class="material-symbols-outlined text-[28px] text-secondary-fixed">'+(k==='pending'?'hourglass_top':'verified_user')+'</span><div class="flex-1"><p class="font-headline-sm text-headline-sm">'+(k==='pending'?'Verification under review':'Verify your identity')+'</p><p class="font-body-sm text-body-sm text-on-primary-container">'+(k==='pending'?'Tap to check the status.':'Add your NIN or BVN to join bigger pools.')+'</p></div><span class="material-symbols-outlined">arrow_forward</span></div></a>';

  // Stats
  sb.rpc('groups_overview').then(({data})=>{const mine=(data||[]).filter(g=>g.joined);App.count($('sGroups'),mine.length);App.count($('sMonthly'),mine.reduce((s,g)=>s+Math.floor(g.target_amount/g.months),0),App.money)});

  // Biometrics
  const can=await bio.supported();
  const paint=()=>{const on=bio.enabledFor(user.id);$('bioSw').setAttribute('aria-checked',on);$('bioSw').className='w-12 h-6 rounded-full p-0.5 flex items-center transition-colors '+(on?'bg-primary-container':'bg-surface-container-highest');$('bioKnob').style.transform=on?'translateX(24px)':'none';$('lock').classList.toggle('hidden',!on);$('lock').classList.toggle('flex',on)};
  if(can){$('bioRow').classList.remove('hidden');$('bioRow').classList.add('flex');paint();
    $('bioSw').onclick=async()=>{
      if(bio.enabledFor(user.id)){bio.clear();paint();App.toast('Face ID / fingerprint turned off.');return}
      try{await bio.enable(user);sessionStorage.setItem('frantech_unlocked','1');paint();App.toast('Face ID / fingerprint is on.')}
      catch(e){App.toast('Could not turn it on. Check your phone has Face ID or a fingerprint set up.',false)}
    }}
  $('lock').onclick=()=>{sessionStorage.removeItem('frantech_unlocked');location.href='login.html'};
  $('out').onclick=async()=>{if(!confirm('Log out of '+profile.full_name+'?'))return;await sb.auth.signOut();bio.clear();sessionStorage.removeItem('frantech_unlocked');location.href='index.html'};
})();
</script></body></html>
