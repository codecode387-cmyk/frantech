<!DOCTYPE html>
<html lang="en"><head><title>Reset password – Frantech Ajo</title>
<meta charset="utf-8"/><meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#00319E}
body{font-family:'Plus Jakarta Sans',sans-serif;color:#131b2e}
main{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding:calc(20px + env(safe-area-inset-top,0)) 20px calc(20px + env(safe-area-inset-bottom,0));background:linear-gradient(#0052FF,#0047E0 55%,#00319E)}
.back{color:#fff;opacity:.9;text-decoration:none;font-size:14px;margin-bottom:22px;width:fit-content}
h1{color:#fff;font-size:30px;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:rgba(255,255,255,.8);font-size:14px;margin:0 0 20px}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:in .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateY(26px)}}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;height:50px;border-radius:14px;border:1.5px solid #c3c5d9;padding:0 14px;font:500 15px 'Plus Jakarta Sans',sans-serif;color:#131b2e;outline:none;transition:border-color .2s,box-shadow .2s}
input:focus{border-color:#0052FF;box-shadow:0 0 0 3px rgba(0,82,255,.18)}
.pw{position:relative}.pw button{position:absolute;right:6px;top:6px;height:38px;padding:0 10px;border:0;background:none;color:#0052FF;font:600 13px 'Plus Jakarta Sans',sans-serif;cursor:pointer}
.primary{height:52px;border:0;border-radius:999px;background:#0052FF;color:#fff;font:700 15px 'Plus Jakarta Sans',sans-serif;cursor:pointer;text-decoration:none;display:flex;align-items:center;justify-content:center}
.primary:disabled{opacity:.6}
.msg{font-size:13px;min-height:18px;margin:0}.err{color:#ba1a1a}.ok{color:#006c47}
.hide{display:none!important}
.shake{animation:shake .4s}@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<a class="back" href="login.html">&larr; Back to log in</a>
<h1 id="t">Set a new password</h1><p class="sub" id="s">Choose a password you haven't used before.</p>
<div class="card">
  <p id="wait" class="msg" style="color:#434656">Checking your reset link…</p>

  <form id="f" class="hide" novalidate>
    <div class="pw"><input id="p1" type="password" placeholder="New password (min. 8 characters)" autocomplete="new-password"/><button type="button" id="eye">Show</button></div>
    <input id="p2" type="password" placeholder="Confirm new password" autocomplete="new-password"/>
    <p class="msg" id="msg" role="status"></p>
    <button class="primary" id="go">Save new password</button>
  </form>

  <div id="bad" class="hide" style="display:none;flex-direction:column;gap:12px">
    <p class="msg err">This reset link has expired or was already used.</p>
    <a class="primary" href="login.html">Request a new link</a>
  </div>
</div>
</main>
<script>
const $=i=>document.getElementById(i);
let shown=false;
function showForm(){if(shown)return;shown=true;$("wait").classList.add("hide");$("f").classList.remove("hide")}
function showBad(){if(shown)return;shown=true;$("wait").classList.add("hide");$("bad").style.display="flex";$("t").textContent="Link expired";$("s").textContent="Go back to log in and tap Forgot password to get a fresh link."}
function say(t,ok){$("msg").textContent=t;$("msg").className="msg "+(ok?"ok":"err")}
function fail(t){say(t);const f=$("f");f.classList.remove("shake");void f.offsetWidth;f.classList.add("shake")}
$("eye").onclick=()=>{const t=$("p1").type==="password";$("p1").type=t?"text":"password";$("p2").type=t?"text":"password";$("eye").textContent=t?"Hide":"Show"};

// The email link signs the user in with a short-lived recovery session
sb.auth.onAuthStateChange((ev,session)=>{if(ev==="PASSWORD_RECOVERY"||(ev==="SIGNED_IN"&&session))showForm()});
if(/error|access_denied/.test(location.hash))showBad();
else setTimeout(async()=>{const {data:{session}}=await sb.auth.getSession();session?showForm():showBad()},2500);

$("f").onsubmit=async e=>{
  e.preventDefault();
  const a=$("p1").value,b=$("p2").value;
  if(a.length<8)return fail("Password must be at least 8 characters.");
  if(a!==b)return fail("The two passwords don't match.");
  const btn=$("go");btn.disabled=true;btn.textContent="Saving…";say("");
  const {error}=await sb.auth.updateUser({password:a});
  if(error){btn.disabled=false;btn.textContent="Save new password";return fail(error.message)}
  say("Password updated. Log in with your new password.",true);
  await sb.auth.signOut();
  sessionStorage.removeItem("frantech_unlocked");
  setTimeout(()=>location.href="login.html",1500);
};
</script></body></html>
